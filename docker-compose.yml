name: ${AGENTX_PROJECT_NAME:-agentx}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    logging: *default-logging
    image: mongo:7.0.34@sha256:c1a84ab5d0c17deed1e0dba1d24bd7c76e5c7b281145fe536911939b1551754c
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    logging: *default-logging
    image: qdrant/qdrant:v1.18.1@sha256:45f8e3ddc2570a4d029877e1b5ec1045c19b3852b4e22a55c7f43b05aea0ca89
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  core:
    logging: *default-logging
    stop_grace_period: 11m
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      args:
        AGENTX_BUILD_REVISION: ${AGENTX_BUILD_REVISION:-working-tree}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_PORT:-3180}:3080"
    environment:
      AGENTX_RUNTIME_RESOURCES_JSON: ${AGENTX_RUNTIME_RESOURCES_JSON:-}
      LOCAL_IMAGES_CONFIG: ${LOCAL_IMAGES_CONFIG:-}
      NODE_ENV: production
      PORT: 3080
      HOST: 0.0.0.0
      AGENTX_PROFILE: ${AGENTX_PROFILE:-demo}
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: ${AGENTX_OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_HOST_NAME: ${OLLAMA_HOST_NAME:-Local Ollama}
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      QDRANT_URL: http://qdrant:6333
      BENCHMARK_SERVICE_URL: http://benchmark:3081
      RAG_SERVICE_URL: http://rag:3082
      DATAAPI_BASE_URL: ${DATAAPI_BASE_URL:-http://data:3083}
      NETWORK_DEVICE_WATCH_MS: ${NETWORK_DEVICE_WATCH_MS:-}
      OPS_WATCH_MS: ${OPS_WATCH_MS:-}
      OPS_WATCH_LANGUAGE: ${OPS_WATCH_LANGUAGE:-}
      MAIL_JOURNAL_RETENTION_DAYS: ${MAIL_JOURNAL_RETENTION_DAYS:-}
      MEMORY_NOTE_RETENTION_DAYS: ${MEMORY_NOTE_RETENTION_DAYS:-}
      IDENTIFIER_VAULT_KEY: ${IDENTIFIER_VAULT_KEY:-}
      DATA_COLLECTOR_PLACEMENT_JSON: ${DATA_COLLECTOR_PLACEMENT_JSON:-}
      HOUSEHOLD_CONVERSATION_BACKEND: ${HOUSEHOLD_CONVERSATION_BACKEND:-auto}
      HOUSEHOLD_FAMILY_CONVERSATION_BACKEND: ${HOUSEHOLD_FAMILY_CONVERSATION_BACKEND:-}
      HOUSEHOLD_VOICE_TASK: ${HOUSEHOLD_VOICE_TASK:-voice_persona_chat}
      HOUSEHOLD_VOICE_MODEL: ${HOUSEHOLD_VOICE_MODEL:-}
      HOUSEHOLD_PERSONA_VOICES: ${HOUSEHOLD_PERSONA_VOICES:-}
      HOUSEHOLD_TEAM_MEMBERS: ${HOUSEHOLD_TEAM_MEMBERS:-}
      ROUNDTABLE_RUNTIME_PARTICIPANTS_ENABLED: ${ROUNDTABLE_RUNTIME_PARTICIPANTS_ENABLED:-}
      ROUNDTABLE_CHAIR_TOKEN: ${ROUNDTABLE_CHAIR_TOKEN:-}
      ROUNDTABLE_OPENCLAW_STRICT_PROVIDERS: ${ROUNDTABLE_OPENCLAW_STRICT_PROVIDERS:-}
      HOUSEHOLD_BROWSER_STT_FALLBACK: ${HOUSEHOLD_BROWSER_STT_FALLBACK:-false}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      VOIX_BASE_URL: ${VOIX_BASE_URL:-}
      VOIX_FALLBACK_URL: ${VOIX_FALLBACK_URL:-}
      VOIX_SPOKEN_CONTROLS_ENABLED: ${VOIX_SPOKEN_CONTROLS_ENABLED:-false}
      HOUSEHOLD_AVATAR_MODULE_URL: ${HOUSEHOLD_AVATAR_MODULE_URL:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      HOUSEHOLD_BRAIN_ENABLED: ${HOUSEHOLD_BRAIN_ENABLED:-true}
      HOUSEHOLD_BRAIN_FAMILY: ${HOUSEHOLD_BRAIN_FAMILY:-true}
      HOUSEHOLD_BRAIN_MODEL: ${HOUSEHOLD_BRAIN_MODEL:-}
      HOUSEHOLD_BRAIN_HOST_URL: ${HOUSEHOLD_BRAIN_HOST_URL:-}
      HOUSEHOLD_BRAIN_EXCLUSIVE: ${HOUSEHOLD_BRAIN_EXCLUSIVE:-false}
      HOUSEHOLD_IMAGE_ROOTS_JSON: ${HOUSEHOLD_IMAGE_ROOTS_JSON:-}
      HOUSEHOLD_IMAGE_FAMILY_SOURCES: ${HOUSEHOLD_IMAGE_FAMILY_SOURCES:-web,photos,media,generated}
      AGENTX_PARENTAL_CODE: ${AGENTX_PARENTAL_CODE:-}
      AGENTX_PARENTAL_SESSION_MINUTES: ${AGENTX_PARENTAL_SESSION_MINUTES:-30}
      AGENTX_FACE_UNLOCK_ENABLED: ${AGENTX_FACE_UNLOCK_ENABLED:-false}
      AGENTX_FACE_UNLOCK_MAX_DISTANCE: ${AGENTX_FACE_UNLOCK_MAX_DISTANCE:-0.4}
      FINANCE_INBOX_PATH: ${FINANCE_INBOX_PATH:-}
      FINANCE_ARCHIVE_PATH: ${FINANCE_ARCHIVE_PATH:-}
      FINANCE_REVIEW_PATH: ${FINANCE_REVIEW_PATH:-}
      FINANCE_INBOX_POLL_MS: ${FINANCE_INBOX_POLL_MS:-900000}
      FINANCE_EXTRACTION_MODEL: ${FINANCE_EXTRACTION_MODEL:-}
      FINANCE_EXTRACTION_RETRIES: ${FINANCE_EXTRACTION_RETRIES:-3}
      FINANCE_ALERT_LARGE_EXPENSE_CENTS: ${FINANCE_ALERT_LARGE_EXPENSE_CENTS:-100000}
      FINANCE_ALERT_CATEGORY_SPIKE_CENTS: ${FINANCE_ALERT_CATEGORY_SPIKE_CENTS:-10000}
      FINANCE_ALERT_MIN_BALANCE_CENTS: ${FINANCE_ALERT_MIN_BALANCE_CENTS:-}
      FINANCE_ALERT_MIN_BALANCE_ACCOUNTS: ${FINANCE_ALERT_MIN_BALANCE_ACCOUNTS:-EOP}
      FINANCE_ALERT_STALE_DAYS: ${FINANCE_ALERT_STALE_DAYS:-45}
      PSYX_ACCESS_TOKEN: ${PSYX_ACCESS_TOKEN:-}
      PSYX_ACCESS_MODE: ${PSYX_ACCESS_MODE:-token}
      PSYX_LOOPBACK_BYPASS: ${PSYX_LOOPBACK_BYPASS:-false}
      PSYX_VOICE_MODE: ${PSYX_VOICE_MODE:-disabled}
      PSYX_AUTO_REVIEW: ${PSYX_AUTO_REVIEW:-true}
      PSYX_DREAM: ${PSYX_DREAM:-true}
      PSYX_REVIEW_TASK: ${PSYX_REVIEW_TASK:-deep_reasoning}
      PSYX_FRONTIER_AGENT: ${PSYX_FRONTIER_AGENT:-}
      PSYX_FRONTIER_MODEL: ${PSYX_FRONTIER_MODEL:-frontier}
      PSYX_FRONTIER_MODE: ${PSYX_FRONTIER_MODE:-local}
      AGENTX_INSTANCE_ROOT: ${AGENTX_INSTANCE_ROOT:-}
      AGENTX_CODING_CONFIG: ${AGENTX_CODING_CONFIG:-}
      OPENCLAW_AGENTX_PROVIDER_BASE_URL: ${OPENCLAW_AGENTX_PROVIDER_BASE_URL:-}
      OPENCLAW_CONVERSATION_HOSTS: ${OPENCLAW_CONVERSATION_HOSTS:-}
      OPENCLAW_CONVERSATION_NO_THINK_MODELS: ${OPENCLAW_CONVERSATION_NO_THINK_MODELS:-}
      OPENCLAW_CONVERSATION_FALLBACK_TASK: ${OPENCLAW_CONVERSATION_FALLBACK_TASK:-}
      AGENTX_TASK_FALLBACKS_JSON: ${AGENTX_TASK_FALLBACKS_JSON:-}
      AGENTX_TASK_FALLBACK_WAIT_MS: ${AGENTX_TASK_FALLBACK_WAIT_MS:-}
      AGENTX_ROUTING_SNAPSHOT_CACHE_MS: ${AGENTX_ROUTING_SNAPSHOT_CACHE_MS:-5000}
      AGENTX_ROUTING_SNAPSHOT_STALE_MS: ${AGENTX_ROUTING_SNAPSHOT_STALE_MS:-300000}
      OPENCLAW_CONFIG_PATH: ${OPENCLAW_CONFIG_PATH:-}
      OPENCLAW_HOME: ${OPENCLAW_HOME:-}
      OPENCLAW_CONTROL_UI_PUBLIC_URL: ${OPENCLAW_CONTROL_UI_PUBLIC_URL:-}
      OPENCLAW_CONTROL_UI_LOCAL_URL: ${OPENCLAW_CONTROL_UI_LOCAL_URL:-}
      OPENCLAW_CONTROL_UI_MODE: ${OPENCLAW_CONTROL_UI_MODE:-}
      OPENCLAW_INVENTORY_SSH_TARGET: ${OPENCLAW_INVENTORY_SSH_TARGET:-}
      OPENCLAW_INVENTORY_SSH_PORT: ${OPENCLAW_INVENTORY_SSH_PORT:-}
      OPENCLAW_INVENTORY_SSH_KEY_PATH: ${OPENCLAW_INVENTORY_SSH_KEY_PATH:-}
      OPENCLAW_INVENTORY_SSH_KNOWN_HOSTS_PATH: ${OPENCLAW_INVENTORY_SSH_KNOWN_HOSTS_PATH:-}
      OPENCLAW_INVENTORY_REMOTE_HOME: ${OPENCLAW_INVENTORY_REMOTE_HOME:-}
      OPENCLAW_INVENTORY_REMOTE_CLI_HOME: ${OPENCLAW_INVENTORY_REMOTE_CLI_HOME:-}
      HERMES_DASHBOARD_URL: ${HERMES_DASHBOARD_URL:-}
      HERMES_PUBLIC_URL: ${HERMES_PUBLIC_URL:-}
      HERMES_AUTHORITY_MODEL: ${HERMES_AUTHORITY_MODEL:-}
      HERMES_AUTHORITY_CONTEXT: ${HERMES_AUTHORITY_CONTEXT:-}
      DSH_STUDIO_PUBLIC_URL: ${DSH_STUDIO_PUBLIC_URL:-}
      DSH_STUDIO_ACCESS_SECRET: ${DSH_STUDIO_ACCESS_SECRET:-}
      DSH_STUDIO_MODEL: ${DSH_STUDIO_MODEL:-}
      CODING_DISPATCHER_SSH_TARGET: ${CODING_DISPATCHER_SSH_TARGET:-}
      CODING_DISPATCHER_REMOTE_ROOT: ${CODING_DISPATCHER_REMOTE_ROOT:-}
      CODING_DELIVERY_GITHUB_TOKEN: ${CODING_DELIVERY_GITHUB_TOKEN:-}
      CODING_DELIVERY_GITHUB_REPOSITORY: ${CODING_DELIVERY_GITHUB_REPOSITORY:-}
      CODING_DELIVERY_SSH_TARGET: ${CODING_DELIVERY_SSH_TARGET:-}
      CODING_DELIVERY_REMOTE_ROOT: ${CODING_DELIVERY_REMOTE_ROOT:-}
      CODING_DELIVERY_ENV_FILE: ${CODING_DELIVERY_ENV_FILE:-}
      CODING_DELIVERY_PROJECT_NAME: ${CODING_DELIVERY_PROJECT_NAME:-}
      CODING_DELIVERY_COMPOSE_OVERRIDE: ${CODING_DELIVERY_COMPOSE_OVERRIDE:-}
      CODING_DELIVERY_PROMOTION_RECEIPT_ROOT: ${CODING_DELIVERY_PROMOTION_RECEIPT_ROOT:-}
      AGENTX_RUNTIME_BRIDGES_ENABLED: ${AGENTX_RUNTIME_BRIDGES_ENABLED:-false}
      AGENTX_PRINTER_VISION_ENABLED: ${AGENTX_PRINTER_VISION_ENABLED:-false}
      CORE_PUBLIC_URL: ${CORE_PUBLIC_URL:-http://127.0.0.1:${CORE_PORT:-3180}}
      BENCHMARK_PUBLIC_URL: http://127.0.0.1:${BENCHMARK_PORT:-3181}
      RAG_PUBLIC_URL: http://127.0.0.1:${RAG_PORT:-3182}
      AGENTX_HOST_HOME_URL: ${AGENTX_HOST_HOME_URL:-}
      AGENTX_HOST_HOME_LABEL: ${AGENTX_HOST_HOME_LABEL:-}
      AGENTX_RESTORE_REHEARSAL_ENABLED: ${AGENTX_RESTORE_REHEARSAL_ENABLED:-false}
      BACKUP_DIR: /backups
      BACKUP_CONFIG_ROOT: /app/product-config
      BACKUP_SCHEDULE_ENABLED: "false"
      MEMORY_REVIEW_MODE: shadow
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - core_logs:/app/logs
      - recovery_data:/backups
      - ${HOUSEHOLD_PHOTOS_DIR:-./docker/empty}:/mnt/household/photos:ro
      - ${HOUSEHOLD_MEDIA_DIR:-./docker/empty}:/mnt/household/media:ro

  benchmark:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/benchmark.Dockerfile
      args:
        AGENTX_BUILD_REVISION: ${AGENTX_BUILD_REVISION:-working-tree}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BENCHMARK_PORT:-3181}:3081"
    environment:
      NODE_ENV: production
      PORT: 3081
      HOST: 0.0.0.0
      AGENTX_PROFILE: ${AGENTX_PROFILE:-demo}
      JUDGE_DEFAULTS_PATH: /app/config-data/judge-host-defaults.json
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: ${AGENTX_OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_HOST_NAME: ${OLLAMA_HOST_NAME:-Local Ollama}
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      CORE_URL: http://core:3080
      CORE_PUBLIC_URL: http://127.0.0.1:${CORE_PORT:-3180}
      DATAAPI_BASE_URL: ${DATAAPI_BASE_URL:-http://data:3083}
      AGENTX_OLLAMA_ALLOWED_TARGETS: ${AGENTX_OLLAMA_ALLOWED_TARGETS:-}
      BENCHMARK_HARNESS_ENABLED: ${BENCHMARK_HARNESS_ENABLED:-false}
      AGENTX_BENCHMARK_HARNESS_URL: ${AGENTX_BENCHMARK_HARNESS_URL:-}
      BENCHMARK_CODE_RUNNER: ${BENCHMARK_CODE_RUNNER:-volume}
      BENCHMARK_CODE_RUNNER_JOBS_DIR: /jobs
    depends_on:
      mongo:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - benchmark_config:/app/config-data
      - benchmark_logs:/app/logs
      - benchmark_jobs:/jobs

  benchmark-runner:
    logging: *default-logging
    # Runs candidate code for Benchmark's coding prompts. It only sees the
    # jobs volume: no network, a read-only image, a tmpfs scratch, one CPU,
    # 512 MB, 128 processes, and jobs run as `nobody`. The capabilities kept
    # are the ones needed to drop to that user and to kill a job's tree.
    build:
      context: .
      dockerfile: docker/benchmark-runner.Dockerfile
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /work:size=256m,mode=0755
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    security_opt:
      - no-new-privileges:true
    environment:
      RUNNER_JOBS_DIR: /jobs
      RUNNER_WORK_DIR: /work
    volumes:
      - benchmark_jobs:/jobs
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/jobs/runner.json');process.exit(Date.now()-s.mtimeMs<30000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  rag:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/rag.Dockerfile
      args:
        AGENTX_BUILD_REVISION: ${AGENTX_BUILD_REVISION:-working-tree}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_PORT:-3182}:3082"
    environment:
      NODE_ENV: production
      PORT: 3082
      HOST: 0.0.0.0
      AGENTX_PROFILE: ${AGENTX_PROFILE:-demo}
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      VECTOR_STORE_TYPE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-agentx_product_embeddings}
      EMBEDDING_PROVIDER: core-proxy
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      CORE_PROXY_URL: http://core:3080
      CORE_URL: http://core:3080
      AGENTX_RESTORE_REHEARSAL_ENABLED: ${AGENTX_RESTORE_REHEARSAL_ENABLED:-false}
      RAG_INGESTION_POLICY_PATH: /config/rag-ingestion-policy.json
    depends_on:
      mongo:
        condition: service_healthy
      core:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3082/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - rag_logs:/app/logs

  data:
    logging: *default-logging
    profiles: [data]
    build:
      context: .
      dockerfile: docker/data.Dockerfile
      args:
        AGENTX_BUILD_REVISION: ${AGENTX_BUILD_REVISION:-working-tree}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATA_PORT:-3183}:3083"
    environment:
      NODE_ENV: production
      PORT: 3083
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      CORE_URL: http://core:3080
      CORE_PROXY_URL: http://core:3080
      DATA_BACKGROUND_JOBS_ENABLED: ${DATA_BACKGROUND_JOBS_ENABLED:-false}
      JANITOR_AI_TIMEOUT_MS: ${JANITOR_AI_TIMEOUT_MS:-}
      # Container path of the optional alias file; the instance override mounts it.
      DATA_PATH_ROLE_ALIASES_FILE: ${DATA_PATH_ROLE_ALIASES_FILE:-}
      NETWORK_SCAN_CIDR: ${NETWORK_SCAN_CIDR:-}
      DATA_HARDWARE_HISTORY_TTL_DAYS: ${DATA_HARDWARE_HISTORY_TTL_DAYS:-7}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3083/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mongo_data:
    name: ${COMPOSE_PROJECT_NAME}_canonical_mongo_data
  qdrant_data:
    name: ${COMPOSE_PROJECT_NAME}_canonical_qdrant_data
  core_logs:
    name: ${COMPOSE_PROJECT_NAME}_canonical_core_logs
  recovery_data:
    name: ${COMPOSE_PROJECT_NAME}_canonical_recovery_data
  benchmark_config:
    name: ${COMPOSE_PROJECT_NAME}_canonical_benchmark_config
  benchmark_logs:
    name: ${COMPOSE_PROJECT_NAME}_canonical_benchmark_logs
  benchmark_jobs:
    name: ${COMPOSE_PROJECT_NAME}_canonical_benchmark_jobs
  rag_logs:
    name: ${COMPOSE_PROJECT_NAME}_canonical_rag_logs
