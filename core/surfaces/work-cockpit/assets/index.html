<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>Pilotage du travail · AgentX</title>
  <link rel="stylesheet" href="/owner/work/cockpit.css">
  <script src="/owner/work/cards.js" defer></script>
  <script src="/owner/work/cockpit.js" defer></script>
</head>
<body>
  <header><div class="bar"><span class="wordmark">Agent<span>X</span></span><span class="location">Espace opérateur</span><span class="local">Lecture seule</span></div></header>
  <main>
    <div class="heading"><h1>Pilotage du travail</h1><div><label for="sample">Collection</label><select id="sample"><option value="sample">Échantillon privé</option><option value="demo">Simulation · 30 dossiers fictifs</option></select></div></div>
    <p id="provenance"></p>
    <noscript>Activez JavaScript pour utiliser le cockpit.</noscript>
    <section id="app" hidden>
      <section id="overview" aria-label="Survol des dossiers"></section>
      <form id="filters" aria-label="Filtres des dossiers">
        <div class="search"><label for="search">Rechercher</label><input id="search" type="search" placeholder="Titre, référence ou exécutant"></div>
        <details id="facets" open><summary>Filtres <span id="filter-count"></span></summary><div class="facet-grid">
        <div><label for="status">État</label><select id="status" name="status"></select></div>
        <div><label for="domain">Domaine</label><select id="domain" name="domain"></select></div>
        <div><label for="type">Type de travail</label><select id="type" name="type"></select></div>
        <div><label for="executor">Exécutant</label><select id="executor" name="executor"></select></div>
        </div></details>
        <button type="reset" id="reset">Réinitialiser</button>
      </form>
      <div class="workspace">
        <section class="list" aria-label="Liste des dossiers">
          <div class="sectionbar"><h2>Dossiers</h2><output id="total" aria-live="polite"></output></div>
          <div class="sort"><label for="sort">Trier par</label><select id="sort"><option value="priority">Décisions en premier</option><option value="recent">Mise à jour récente</option><option value="title">Titre de A à Z</option></select></div>
          <div id="rows"></div>
        </section>
        <article id="detail" aria-label="Fiche du travail" tabindex="-1"></article>
      </div>
      <details id="sources"><summary>Sources et registre des exécutants</summary><p id="pipeline-health"></p><p id="registry-health"></p><p>Une observation du runtime ne confirme ni disponibilité pour une tâche, ni activité en cours.</p><ul id="roster"></ul></details>
    </section>
  </main>
</body>
</html>
