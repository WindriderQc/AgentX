# AIOps policy overlay for the single-capacity local-inference coding lane.
# The wrapper also holds a host-wide flock; disabling these tools prevents one
# DSH turn from creating hidden in-process fan-out behind that lock.
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
# Raw events stay in the isolated worker home. The host projects safe enums,
# timestamps and test outcomes into the run receipt; Pipeline never reads them.
- id: session-persistence-jsonl
  config:
    root: /home/agent/.dsh/progress-sessions
    compression: none
    packChunks: false
