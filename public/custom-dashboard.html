<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Dashboards - AgentX</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            padding-top: 100px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .dashboard-sidebar {
            width: 250px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            height: calc(100vh - 150px);
            overflow-y: auto;
            position: fixed;
        }

        .dashboard-main {
            margin-left: 270px;
            width: calc(100% - 270px);
        }

        .dashboard-list-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .dashboard-list-item:hover {
            background: rgba(124, 240, 255, 0.1);
        }

        .dashboard-list-item.active {
            background: rgba(124, 240, 255, 0.2);
            color: var(--accent);
            font-weight: 600;
        }

        /* Grid Layout */
        .widget-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            min-height: 400px;
        }

        .widget-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Default span */
        .widget-span-1 { grid-column: span 1; }
        .widget-span-2 { grid-column: span 2; }
        .widget-span-3 { grid-column: span 3; }
        .widget-span-4 { grid-column: span 4; }

        .widget-span-row-1 { grid-row: span 1; height: 200px; }
        .widget-span-row-2 { grid-row: span 2; height: 416px; }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .widget-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .widget-content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Metric Widget */
        .metric-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent);
        }

        /* Edit Mode Styles */
        .widget-actions {
            opacity: 0;
            transition: opacity 0.2s;
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            border-radius: 4px;
            padding: 4px;
            z-index: 10;
        }
        
        .widget-card:hover .widget-actions {
            opacity: 1;
        }

        .btn-action {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 4px;
        }
        
        .btn-action:hover {
            color: var(--accent);
        }

        .add-widget-placeholder {
            border: 2px dashed var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.2s;
        }

        .add-widget-placeholder:hover {
            opacity: 1;
            border-color: var(--accent);
            background: rgba(124, 240, 255, 0.05);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 24px;
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

    </style>
</head>
<body>
    <div id="nav-container"></div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="margin:0; font-size:14px; text-transform:uppercase; color:var(--muted);">Dashboards</h3>
                <button onclick="DashboardManager.openCreateModal()" class="icon-btn" title="Create Dashboard"><i class="fas fa-plus"></i></button>
            </div>
            
            <div id="dashboardList">
                <!-- List populated by JS -->
                <div class="dashboard-list-item active">
                    <i class="fas fa-chart-line"></i> Loading...
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="dashboard-header">
                <div>
                    <h1 id="dashboardTitle">Select a Dashboard</h1>
                    <p id="dashboardDesc" style="color:var(--muted); margin-top:4px;"></p>
                </div>
                <div id="dashboardControls" style="display:none; gap:8px;">
                    <button class="btn btn-secondary" onclick="DashboardManager.toggleEditMode()" id="btnEditMode">
                        <i class="fas fa-pencil-alt"></i> Edit Layout
                    </button>
                    <button class="btn btn-secondary" onclick="DashboardManager.refreshData()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                     <button class="btn btn-danger" onclick="DashboardManager.deleteDashboard()" id="btnDelete">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <div id="widgetGrid" class="widget-grid">
                <!-- Widgets populated by JS -->
            </div>
        </main>
    </div>

    <!-- Create Dashboard Modal -->
    <div id="modalCreateDashboard" class="modal">
        <div class="modal-content">
            <h2>Create New Dashboard</h2>
            <form onsubmit="DashboardManager.createDashboard(event)">
                <div class="form-group" style="margin-top:16px;">
                    <label>Dashboard Name</label>
                    <input type="text" id="newDashName" class="form-input" style="width:100%; padding:8px; margin-top:4px;" required>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label>Description</label>
                    <textarea id="newDashDesc" class="form-input" style="width:100%; padding:8px; margin-top:4px; height:60px;"></textarea>
                </div>
                 <div class="form-group" style="margin-top:12px;">
                    <label>
                        <input type="checkbox" id="newDashPublic"> Public (Visible to all workspace members)
                    </label>
                </div>
                <div style="margin-top:24px; display:flex; justify-content:flex-end; gap:8px;">
                    <button type="button" class="btn btn-secondary" onclick="DashboardManager.closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="background:var(--accent); color:var(--bg); border:none; padding:8px 16px; border-radius:4px;">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Widget Modal -->
    <div id="modalAddWidget" class="modal">
        <div class="modal-content" style="width:600px;">
            <h2>Configure Widget</h2>
            <form onsubmit="DashboardManager.saveWidget(event)">
                <input type="hidden" id="widgetId">
                <div class="form-group" style="margin-top:16px;">
                    <label>Widget Title</label>
                    <input type="text" id="widgetTitle" class="form-input" style="width:100%; padding:8px; margin-top:4px;" required>
                </div>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-top:16px;">
                    <div>
                        <label>Type</label>
                        <select id="widgetType" class="form-input" style="width:100%; padding:8px;" onchange="DashboardManager.updateWidgetForm()">
                            <option value="metric">Metric (Single Value)</option>
                            <option value="chart">Chart</option>
                            <option value="table">Table</option>
                        </select>
                    </div>
                    <div>
                        <label>Size</label>
                        <select id="widgetSize" class="form-input" style="width:100%; padding:8px;">
                            <option value="1">Small (1/4)</option>
                            <option value="2">Medium (1/2)</option>
                            <option value="4">Full Width</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top:16px;">
                    <label>Data Source</label>
                    <select id="widgetCollection" class="form-input" style="width:100%; padding:8px;">
                        <option value="conversations">Conversations</option>
                        <option value="prompts">Prompts</option>
                        <option value="alerts">Alerts</option>
                    </select>
                </div>

                <!-- Aggregation Options -->
                <div id="aggOptions" style="margin-top:16px;">
                     <label>Aggregation</label>
                     <select id="widgetAgg" class="form-input" style="width:100%; padding:8px;">
                        <option value="count">Count Total</option>
                     </select>
                </div>

                <!-- Chart Options -->
                <div id="chartOptions" style="margin-top:16px; display:none;">
                     <label>Group By</label>
                     <select id="widgetGroupBy" class="form-input" style="width:100%; padding:8px;">
                        <option value="createdAt">Date (Day)</option>
                        <option value="model">Model</option>
                        <option value="userId">User</option>
                     </select>
                     
                     <div style="margin-top:12px;">
                         <label>Chart Style</label>
                         <div style="display:flex; gap:10px; margin-top:4px;">
                             <label><input type="radio" name="chartStyle" value="line" checked> Line</label>
                             <label><input type="radio" name="chartStyle" value="bar"> Bar</label>
                             <label><input type="radio" name="chartStyle" value="pie"> Pie</label>
                             <label><input type="radio" name="chartStyle" value="doughnut"> Doughnut</label>
                         </div>
                     </div>
                </div>

                <!-- Table Options -->
                <div id="tableOptions" style="margin-top:16px; display:none;">
                    <label>Aggregation Pipeline (JSON Array)</label>
                    <div style="font-size:11px; color:var(--muted); margin-bottom:4px;">MongoDB Aggregation stages (e.g., $match, $group, $project)</div>
                    <textarea id="widgetPipeline" class="form-input" style="width:100%; padding:8px; height:100px; font-family:monospace;" placeholder='[&#10;  { "$match": { "status": "active" } },&#10;  { "$project": { "name": 1, "value": 1 } }&#10;]'></textarea>
                </div>

                <div style="margin-top:24px; display:flex; justify-content:flex-end; gap:8px;">
                     <button type="button" class="btn btn-secondary" onclick="DashboardManager.closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="background:var(--accent); color:var(--bg); border:none; padding:8px 16px; border-radius:4px;">Save Widget</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/components/nav.js"></script>
    <script src="/js/workspace.js"></script>
    <script src="/js/dashboard-builder.js"></script>
    <script>
        // Init
        injectNav('custom-dashboards'); 
        document.addEventListener('DOMContentLoaded', () => {
             // Wait for workspace to init?
             setTimeout(() => DashboardManager.init(), 100);
        });
    </script>
</body>
</html>
