<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentX • Hardware Matrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/hardware-matrix.css">
</head>

<body>
    <div id="nav-container"></div>
    <script src="/js/components/nav.js"></script>
    <script src="/js/workspace.js"></script>
    <script>injectNav('hardware-matrix');</script>

    <div class="bg-grid"></div>

    <div class="hardware-container">
        <!-- Header -->
        <div class="hardware-header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <div class="eyebrow">AgentX • Performance Analysis</div>
                    <h1><i class="fas fa-server"></i> Hardware Matrix</h1>
                    <p>Compare model performance across different hardware configurations</p>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button id="refreshBtn" class="btn-secondary" style="height: 42px;">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Backend Stats Overview -->
        <div class="stats-grid" id="backendStats">
            <!-- Populated by JS -->
        </div>

        <!-- Model Selector -->
        <div class="model-selector-panel">
            <div class="panel-header">
                <h3><i class="fas fa-cube"></i> Select Model to Compare</h3>
            </div>
            <div class="model-selector-body">
                <div class="filter-group">
                    <label><i class="fas fa-search"></i> Search Models</label>
                    <input type="text" id="modelSearch" placeholder="Type to filter models...">
                </div>
                <div id="modelList" class="model-list loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading available models...</p>
                </div>
            </div>
        </div>

        <!-- Host Comparison Panel (shown when model selected) -->
        <div id="comparisonPanel" class="comparison-panel" style="display: none;">
            <div class="panel-header">
                <h3><i class="fas fa-chart-bar"></i> Host Comparison: <span id="selectedModelName"></span></h3>
            </div>
            <div class="comparison-body">
                <div id="comparisonTable">
                    <!-- Populated by JS -->
                </div>

                <div id="comparisonCharts" style="margin-top: 2rem;">
                    <div class="chart-grid">
                        <div class="chart-card">
                            <h4>VRAM Usage</h4>
                            <canvas id="vramChart"></canvas>
                        </div>
                        <div class="chart-card">
                            <h4>Quality Score</h4>
                            <canvas id="qualityChart"></canvas>
                        </div>
                        <div class="chart-card">
                            <h4>Speed (tokens/sec)</h4>
                            <canvas id="speedChart"></canvas>
                        </div>
                        <div class="chart-card">
                            <h4>VRAM Efficiency</h4>
                            <canvas id="efficiencyChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quantization Comparison Panel -->
        <div id="quantizationPanel" class="quantization-panel" style="display: none;">
            <div class="panel-header">
                <h3><i class="fas fa-microchip"></i> Optimal Quantization Analysis</h3>
                <div class="filter-group" style="margin: 0;">
                    <label><i class="fas fa-filter"></i> Backend</label>
                    <select id="backendFilter">
                        <option value="">All Backends</option>
                        <option value="CUDA">CUDA</option>
                        <option value="Metal">Metal</option>
                        <option value="CPU">CPU</option>
                        <option value="ROCm">ROCm</option>
                    </select>
                </div>
            </div>
            <div class="quantization-body">
                <div id="quantizationTable">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/js/hardware-matrix.js"></script>
</body>

</html>
