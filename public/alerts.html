<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - AgentX</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AgentX Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    
    <style>
        /* Page Container */
        .alerts-page {
            padding-top: 90px; /* Adjusted for fixed nav */
            max-width: 1600px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
            padding-bottom: 40px;
            min-height: 100vh;
        }
        
        /* Page Header */
        .page-header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 16px;
            border: 1px solid var(--panel-border);
        }
        
        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-header h1 i {
            color: var(--accent);
        }
        
        .page-header p {
            color: var(--muted);
            margin: 0;
        }
        
        /* Dashboard Styles */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title i {
            color: var(--accent);
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #0b6470 100%);
            color: var(--bg);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(124, 240, 255, 0.3);
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 3rem;
        }
        
        .loading-spinner.active {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(124, 240, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Analytics Styles */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--panel-border);
            display: flex;
            gap: 1rem;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: rgba(124, 240, 255, 0.2);
        }
        
        .metric-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            flex-shrink: 0;
        }
        
        .metric-content {
            flex: 1;
        }
        
        .metric-label {
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.25rem;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--panel-border);
        }
        
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        
        .chart-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }
        
        .chart-header h3 i {
            color: var(--accent);
        }
        
        .chart-wrapper {
            position: relative;
            height: 350px;
        }
        
        .chart-card.full-width .chart-wrapper {
            height: 400px;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .alerts-page {
                padding-top: 70px;
                padding-left: 16px;
                padding-right: 16px;
            }
            
            .page-header {
                padding: 1.5rem;
            }
            
            .page-header h1 {
                font-size: 1.5rem;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <!-- Navigation -->
    <div id="nav-container"></div>
    <script src="/js/components/nav.js"></script>
    <script src="/js/workspace.js"></script>
    <script>injectNav('alerts');</script>

    <!-- Main Content -->
    <div class="alerts-page">
        <!-- Page Header -->
        <div class="page-header">
            <h1><i class="fas fa-bell"></i> Alerts</h1>
            <p>Real-time alert monitoring, management, and analytics</p>
        </div>

        <!-- Analytics Section -->
        <div id="alert-analytics-container" class="mb-4">
            <!-- Loading Spinner -->
            <div class="loading-spinner active" id="loading-spinner-analytics">
                <div class="spinner"></div>
                <p style="color: var(--muted);">Loading analytics...</p>
            </div>
        </div>

        <!-- Alerts List Section -->
        <div class="card">
            <h5 class="card-title">
                <i class="fas fa-filter"></i> Filters & Actions
            </h5>
            <div id="alerts-filters">
                <!-- Filters will be rendered here -->
            </div>
        </div>

        <div class="card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title" style="margin: 0;">
                    <i class="fas fa-list"></i> Alerts List
                </h5>
                <button class="btn btn-primary" onclick="window.alertsDashboard && window.alertsDashboard.loadAlerts()">
                    <i class="fas fa-sync-alt"></i> Refresh List
                </button>
            </div>
            
            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loading-spinner-dashboard">
                <div class="spinner"></div>
                <p style="color: var(--muted);">Loading alerts...</p>
            </div>
            
            <!-- Alerts Container -->
            <div id="alerts-container">
                <!-- Alerts will be rendered here -->
            </div>
            
            <!-- Pagination -->
            <div id="alerts-pagination" class="mt-4">
                <!-- Pagination will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Toast Notifications -->
    <script src="/js/toast.js"></script>
    
    <script type="module">
        import AlertsDashboard from './js/alerts-dashboard.js';
        import AlertAnalytics from './js/alert-analytics.js';
        
        // Initialize dashboard and analytics when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Initialize Analytics (Top Section)
            try {
                console.log('Initializing Alert Analytics...');
                const analytics = new AlertAnalytics({
                    containerId: 'alert-analytics-container',
                    refreshInterval: 60000, // 1 minute
                    timeRange: 7 // 7 days
                });
                
                // Expose to window
                window.alertAnalytics = analytics;
                
                // Initialize
                await analytics.init();
                
                console.log('Alert Analytics ready');
            } catch (error) {
                console.error('Failed to initialize Alert Analytics:', error);
                const container = document.getElementById('alert-analytics-container');
                if (container) {
                    container.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle"></i> Failed to load analytics: ${error.message}
                            <button onclick="location.reload()" class="btn btn-sm btn-outline-danger ms-3">Retry</button>
                        </div>
                    `;
                }
            }

            // 2. Initialize Alerts Dashboard (List Section)
            try {
                // Show loading spinner
                const spinner = document.getElementById('loading-spinner-dashboard');
                if (spinner) spinner.classList.add('active');
                
                // Create dashboard instance
                // Note: We deliberately pass a dummy ID for statsContainerId to avoid rendering the redundant stats row
                const dashboard = new AlertsDashboard({
                    containerId: 'alerts-container',
                    statsContainerId: 'alerts-stats-hidden', 
                    filtersContainerId: 'alerts-filters',
                    refreshInterval: 30000, // 30 seconds
                    perPage: 20
                });
                
                // Expose to window for onclick handlers
                window.alertsDashboard = dashboard;
                
                // Initialize
                await dashboard.init();
                
                // Render filters UI
                dashboard.renderFilters();
                
                // Hide loading spinner
                if (spinner) spinner.classList.remove('active');
                
                console.log('Alerts Dashboard loaded successfully');
                
            } catch (error) {
                console.error('Failed to initialize Alerts Dashboard:', error);
                const container = document.getElementById('alerts-container');
                if (container) {
                    container.innerHTML = `
                        <div style="padding: 2rem; text-align: center;">
                            <div class="card" style="max-width: 500px; margin: 0 auto;">
                                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--accent); margin-bottom: 1rem;"></i>
                                <h3 style="margin-bottom: 1rem;">Failed to Load Alerts List</h3>
                                <p style="color: var(--muted); margin-bottom: 1rem;">${error.message}</p>
                                <button onclick="location.reload()" class="btn btn-primary">
                                    <i class="fas fa-sync-alt"></i> Retry
                                </button>
                            </div>
                        </div>
                    `;
                }
            }
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (window.alertsDashboard) {
                window.alertsDashboard.destroy();
            }
            if (window.alertAnalytics) {
                window.alertAnalytics.destroy();
            }
        });
    </script>
</body>
</html>
