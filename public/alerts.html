<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - AgentX</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AgentX Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    
    <style>
        /* Page Container */
        .alerts-page {
            padding-top: 90px; /* Adjusted for fixed nav */
            max-width: 1600px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
            padding-bottom: 40px;
            min-height: 100vh;
        }
        
        /* Page Header */
        .page-header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 16px;
            border: 1px solid var(--panel-border);
        }
        
        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-header h1 i {
            color: var(--accent);
        }
        
        .page-header p {
            color: var(--muted);
            margin: 0;
        }
        
        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 0;
        }
        
        .tab-button {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            position: relative;
            bottom: -2px;
        }
        
        .tab-button:hover {
            color: var(--text);
            background: rgba(124, 240, 255, 0.05);
        }
        
        .tab-button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        
        .tab-button i {
            margin-right: 8px;
        }
        
        /* Tab Content */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Dashboard Styles */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title i {
            color: var(--accent);
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #0b6470 100%);
            color: var(--bg);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(124, 240, 255, 0.3);
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 3rem;
        }
        
        .loading-spinner.active {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(124, 240, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Analytics Styles */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--panel-border);
            display: flex;
            gap: 1rem;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: rgba(124, 240, 255, 0.2);
        }
        
        .metric-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            flex-shrink: 0;
        }
        
        .metric-content {
            flex: 1;
        }
        
        .metric-label {
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.25rem;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--panel-border);
        }
        
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        
        .chart-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }
        
        .chart-header h3 i {
            color: var(--accent);
        }
        
        .chart-wrapper {
            position: relative;
            height: 350px;
        }
        
        .chart-card.full-width .chart-wrapper {
            height: 400px;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .alerts-page {
                padding-top: 70px;
                padding-left: 16px;
                padding-right: 16px;
            }
            
            .page-header {
                padding: 1.5rem;
            }
            
            .page-header h1 {
                font-size: 1.5rem;
            }
            
            .tab-nav {
                gap: 4px;
            }
            
            .tab-button {
                padding: 10px 16px;
                font-size: 13px;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <!-- Navigation -->
    <div id="nav-container"></div>
    <script src="/js/components/nav.js"></script>
    <script src="/js/workspace.js"></script>
    <script>injectNav('alerts');</script>

    <!-- Main Content -->
    <div class="alerts-page">
        <!-- Page Header -->
        <div class="page-header">
            <h1><i class="fas fa-bell"></i> Alerts</h1>
            <p>Real-time alert monitoring, management, and analytics</p>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-button active" data-tab="dashboard">
                <i class="fas fa-list"></i> Dashboard
            </button>
            <button class="tab-button" data-tab="analytics">
                <i class="fas fa-chart-line"></i> Analytics
            </button>
        </div>

        <!-- Dashboard Tab -->
        <div id="tab-dashboard" class="tab-content active">
            <!-- Statistics Banner -->
            <div id="alerts-stats" class="mb-4">
                <!-- Statistics will be rendered here -->
            </div>

            <!-- Filters -->
            <div class="card">
                <h5 class="card-title">
                    <i class="fas fa-filter"></i> Filters & Actions
                </h5>
                <div id="alerts-filters">
                    <!-- Filters will be rendered here -->
                </div>
            </div>

            <!-- Alerts List -->
            <div class="card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title" style="margin: 0;">
                        <i class="fas fa-list"></i> Alerts
                    </h5>
                    <button class="btn btn-primary" onclick="window.alertsDashboard && window.alertsDashboard.loadAlerts()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                
                <!-- Loading Spinner -->
                <div class="loading-spinner" id="loading-spinner-dashboard">
                    <div class="spinner"></div>
                    <p style="color: var(--muted);">Loading alerts...</p>
                </div>
                
                <!-- Alerts Container -->
                <div id="alerts-container">
                    <!-- Alerts will be rendered here -->
                </div>
                
                <!-- Pagination -->
                <div id="alerts-pagination" class="mt-4">
                    <!-- Pagination will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Analytics Tab -->
        <div id="tab-analytics" class="tab-content">
            <!-- Loading Spinner -->
            <div class="loading-spinner active" id="loading-spinner-analytics">
                <div class="spinner"></div>
                <p style="color: var(--muted);">Loading analytics...</p>
            </div>
            
            <!-- Analytics Container -->
            <div id="alert-analytics-container" style="display: none;">
                <!-- Analytics content will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Toast Notifications -->
    <script src="/js/toast.js"></script>
    
    <!-- Tab Switching Logic -->
    <script>
        // Tab switching functionality
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');
                
                // Update active button
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // Update active content
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                document.getElementById(`tab-${tabName}`).classList.add('active');
                
                // Initialize analytics if switching to analytics tab and not yet initialized
                if (tabName === 'analytics' && !window.alertAnalytics) {
                    initAnalytics();
                }
            });
        });
    </script>
    
    <!-- Alerts Dashboard Module -->
    <script type="module">
        import AlertsDashboard from './js/alerts-dashboard.js';
        
        // Initialize dashboard when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Show loading spinner
                const spinner = document.getElementById('loading-spinner-dashboard');
                if (spinner) spinner.classList.add('active');
                
                // Create dashboard instance
                const dashboard = new AlertsDashboard({
                    containerId: 'alerts-container',
                    statsContainerId: 'alerts-stats',
                    filtersContainerId: 'alerts-filters',
                    refreshInterval: 30000, // 30 seconds
                    perPage: 20
                });
                
                // Expose to window for onclick handlers
                window.alertsDashboard = dashboard;
                
                // Initialize
                await dashboard.init();
                
                // Render filters UI
                dashboard.renderFilters();
                
                // Hide loading spinner
                if (spinner) spinner.classList.remove('active');
                
                console.log('Alerts Dashboard loaded successfully');
                
            } catch (error) {
                console.error('Failed to initialize Alerts Dashboard:', error);
                const container = document.getElementById('alerts-container');
                if (container) {
                    container.innerHTML = `
                        <div style="padding: 2rem; text-align: center;">
                            <div class="card" style="max-width: 500px; margin: 0 auto;">
                                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--accent); margin-bottom: 1rem;"></i>
                                <h3 style="margin-bottom: 1rem;">Failed to Load Dashboard</h3>
                                <p style="color: var(--muted); margin-bottom: 1rem;">${error.message}</p>
                                <button onclick="location.reload()" class="btn btn-primary">
                                    <i class="fas fa-sync-alt"></i> Retry
                                </button>
                            </div>
                        </div>
                    `;
                }
            }
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (window.alertsDashboard) {
                window.alertsDashboard.destroy();
            }
            if (window.alertAnalytics) {
                window.alertAnalytics.destroy();
            }
        });
    </script>
    
    <!-- Analytics Module (loaded on demand) -->
    <script type="module">
        import AlertAnalytics from './js/alert-analytics.js';
        
        // Function to initialize analytics (called when tab is opened)
        window.initAnalytics = async function() {
            if (window.alertAnalytics) {
                // Already initialized
                return;
            }
            
            try {
                console.log('Initializing Alert Analytics...');
                
                const analytics = new AlertAnalytics({
                    containerId: 'alert-analytics-container',
                    refreshInterval: 60000, // 1 minute
                    timeRange: 7 // 7 days
                });
                
                // Expose to window
                window.alertAnalytics = analytics;
                
                // Initialize the dashboard
                await analytics.init();
                
                // Hide loading, show content
                document.getElementById('loading-spinner-analytics').classList.remove('active');
                document.getElementById('loading-spinner-analytics').style.display = 'none';
                document.getElementById('alert-analytics-container').style.display = 'block';
                
                console.log('Alert Analytics ready');
            } catch (error) {
                console.error('Failed to initialize Alert Analytics:', error);
                
                const spinner = document.getElementById('loading-spinner-analytics');
                if (spinner) {
                    spinner.classList.remove('active');
                    spinner.innerHTML = `
                        <div style="text-align: center;">
                            <div class="card" style="max-width: 500px; margin: 0 auto;">
                                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--accent); margin-bottom: 1rem;"></i>
                                <h3 style="margin-bottom: 1rem;">Failed to Load Analytics</h3>
                                <p style="color: var(--muted); margin-bottom: 1rem;">${error.message}</p>
                                <button onclick="location.reload()" class="btn btn-primary">
                                    <i class="fas fa-sync-alt"></i> Retry
                                </button>
                            </div>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
