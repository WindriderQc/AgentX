<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual LLM Gallery • AgentX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/css/agentx.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(124, 240, 255, 0.2);
    }

    .gallery-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .gallery-actions {
      display: flex;
      gap: 12px;
    }

    .prompt-section {
      background: var(--surface);
      border: 1px solid rgba(124, 240, 255, 0.2);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .prompt-input-wrapper {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .prompt-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid rgba(124, 240, 255, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      resize: vertical;
      min-height: 80px;
    }

    .prompt-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 240, 255, 0.1);
    }

    .generate-btn {
      background: linear-gradient(135deg, var(--accent) 0%, #00d4ff 100%);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(124, 240, 255, 0.4);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .model-selector {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .model-selector select {
      background: var(--bg);
      border: 1px solid rgba(124, 240, 255, 0.3);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    .model-status {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .image-card {
      background: var(--surface);
      border: 1px solid rgba(124, 240, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      cursor: pointer;
    }

    .image-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(124, 240, 255, 0.2);
      border-color: var(--accent);
    }

    .image-wrapper {
      width: 100%;
      height: 280px;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-placeholder {
      color: var(--muted);
      font-size: 48px;
    }

    .image-meta {
      padding: 16px;
    }

    .image-prompt {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .image-details {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .image-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(124, 240, 255, 0.1);
    }

    .image-actions button {
      flex: 1;
      background: var(--bg);
      border: 1px solid rgba(124, 240, 255, 0.2);
      border-radius: 6px;
      padding: 8px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .image-actions button:hover {
      border-color: var(--accent);
      background: rgba(124, 240, 255, 0.1);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 10000;
      padding: 40px;
      align-items: center;
      justify-content: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      position: relative;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: var(--text);
      font-size: 32px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      padding: 40px;
      color: var(--accent);
    }

    .loading-spinner.active {
      display: block;
    }

    .loading-spinner i {
      font-size: 48px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="gallery-container">
    <div class="gallery-header">
      <h1><i class="fas fa-image"></i> Visual LLM Gallery</h1>
      <div class="gallery-actions">
        <button class="btn" onclick="window.location.href='/dashboard.html'">
          <i class="fas fa-home"></i> Dashboard
        </button>
        <button class="btn" onclick="downloadAll()">
          <i class="fas fa-download"></i> Download All
        </button>
      </div>
    </div>

    <!-- Prompt Input Section -->
    <div class="prompt-section">
      <div class="prompt-input-wrapper">
        <textarea
          id="promptInput"
          class="prompt-input"
          placeholder="Describe the image you want to generate...&#10;&#10;Example: A serene mountain landscape at sunset with a lake reflection, photorealistic style, 4k quality"
        ></textarea>
        <button class="generate-btn" id="generateBtn" onclick="generateImage()">
          <i class="fas fa-magic"></i> Generate
        </button>
      </div>
      <div class="model-selector">
        <label for="modelSelect"><i class="fas fa-brain"></i> Model:</label>
        <select id="modelSelect" disabled>
          <option>Loading models…</option>
        </select>
        <p class="model-status" id="modelStatus" aria-live="polite"></p>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
      <i class="fas fa-spinner"></i>
      <p>Generating your image...</p>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid">
      <!-- Images will be inserted here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <i class="fas fa-images"></i>
      <h2>No images yet</h2>
      <p>Generate your first image using the prompt above</p>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()">
        <i class="fas fa-times"></i>
      </button>
      <img id="lightboxImage" src="" alt="Full size">
    </div>
  </div>

  <script>
    const DEFAULT_MODEL = 'x/flux2-klein:9b';
    let images = [];

    // Load existing images on page load
    async function loadImages() {
      try {
        const response = await fetch('/api/gallery/images', {
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          }
        });

        if (!response.ok) {
          console.error('Failed to load images');
          return;
        }

        images = await response.json();
        renderGallery();
      } catch (error) {
        console.error('Error loading images:', error);
      }
    }

    // Generate new image
    async function generateImage() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }

      const model = document.getElementById('modelSelect').value;
      const generateBtn = document.getElementById('generateBtn');
      const loadingSpinner = document.getElementById('loadingSpinner');

      generateBtn.disabled = true;
      loadingSpinner.classList.add('active');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({
            message: prompt,
            model: model,
            persona: 'visual_llm'
          })
        });

        if (!response.ok) {
          throw new Error('Generation failed');
        }

        const result = await response.json();

        // Extract image from response (assuming it returns attachment metadata)
        if (result.attachments && result.attachments.length > 0) {
          images.unshift({
            id: result.messageId,
            url: result.attachments[0].url,
            prompt: prompt,
            model: model,
            timestamp: new Date().toISOString(),
            metadata: result.attachments[0].metadata
          });

          renderGallery();
          document.getElementById('promptInput').value = '';
        }
      } catch (error) {
        console.error('Error generating image:', error);
        alert('Failed to generate image. Please try again.');
      } finally {
        generateBtn.disabled = false;
        loadingSpinner.classList.remove('active');
      }
    }

    // Render gallery grid
    function renderGallery() {
      const galleryGrid = document.getElementById('galleryGrid');
      const emptyState = document.getElementById('emptyState');

      if (images.length === 0) {
        emptyState.style.display = 'block';
        galleryGrid.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      galleryGrid.style.display = 'grid';
      galleryGrid.innerHTML = images.map(image => `
        <div class="image-card" onclick="openLightbox('${image.url}')">
          <div class="image-wrapper">
            ${image.url
              ? `<img src="${image.url}" alt="${image.prompt}" loading="lazy">`
              : '<div class="image-placeholder"><i class="fas fa-image"></i></div>'
            }
          </div>
          <div class="image-meta">
            <div class="image-prompt">${image.prompt}</div>
            <div class="image-details">
              <span><i class="fas fa-brain"></i> ${image.model}</span>
              <span><i class="fas fa-clock"></i> ${formatTimestamp(image.timestamp)}</span>
            </div>
            <div class="image-actions">
              <button onclick="event.stopPropagation(); downloadImage('${image.url}', '${image.id}')">
                <i class="fas fa-download"></i> Download
              </button>
              <button onclick="event.stopPropagation(); regenerateImage('${image.prompt}')">
                <i class="fas fa-redo"></i> Regenerate
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Populate model dropdown from Ollama models
    async function populateModelSelect() {
      const select = document.getElementById('modelSelect');
      const status = document.getElementById('modelStatus');
      const fallbackOption = `<option value="${DEFAULT_MODEL}">${DEFAULT_MODEL} (default)</option>`;
      select.innerHTML = '<option>Loading models…</option>';
      select.disabled = true;
      if (status) status.textContent = '';

      try {
        const response = await fetch('/api/ollama/models');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();
        const models = Array.isArray(payload.data) ? payload.data : [];
        const names = Array.from(new Set(models
          .map(model => model?.name)
          .filter(Boolean)));

        if (names.length === 0) {
          throw new Error('No models returned from Ollama');
        }

        const options = names
          .map((name) => `<option value="${escapeHtml(name)}"${name === DEFAULT_MODEL ? ' selected' : ''}>${escapeHtml(name)}</option>`)
          .join('');

        select.innerHTML = options;
        if (!names.includes(DEFAULT_MODEL)) {
          const defaultOption = document.createElement('option');
          defaultOption.value = DEFAULT_MODEL;
          defaultOption.textContent = `${DEFAULT_MODEL} (default)`;
          defaultOption.selected = true;
          select.appendChild(defaultOption);
          select.value = DEFAULT_MODEL;
        } else {
          select.value = DEFAULT_MODEL;
        }
      } catch (error) {
        console.error('Failed to load Ollama models:', error);
        select.innerHTML = fallbackOption;
        select.value = DEFAULT_MODEL;
        if (status) {
          status.textContent = 'Unable to load Ollama models right now; using default.';
        }
      } finally {
        select.disabled = false;
      }
    }

    function escapeHtml(text) {
      const safeText = text == null ? '' : String(text);
      return safeText.replace(/[&<>"']/g, (match) => {
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return map[match] || match;
      });
    }


    // Lightbox controls
    function openLightbox(imageUrl) {
      document.getElementById('lightboxImage').src = imageUrl;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    // Download single image
    function downloadImage(url, filename) {
      const link = document.createElement('a');
      link.href = url;
      link.download = `image_${filename}.png`;
      link.click();
    }

    // Download all images
    async function downloadAll() {
      for (const image of images) {
        await new Promise(resolve => setTimeout(resolve, 500)); // Stagger downloads
        downloadImage(image.url, image.id);
      }
    }

    // Regenerate with same prompt
    function regenerateImage(prompt) {
      document.getElementById('promptInput').value = prompt;
      generateImage();
    }

    // Format timestamp
    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
      return date.toLocaleDateString();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'Enter' && e.ctrlKey) generateImage();
    });

    // Initialize
    populateModelSelect();
    loadImages();
  </script>
</body>
</html>
