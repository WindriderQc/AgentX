<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Catalog | AgentX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Extra styles for this page specifically */
        .glass-panel {
            background: rgba(18, 23, 38, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; width: 90%; max-width: 800px; max-height: 90vh;
            overflow-y: auto; transform: translateY(20px); transition: transform 0.3s;
            display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .full-screen-modal { max-width: 95vw; height: 90vh; }
        
        .tab-nav { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 20px; }
        .tab-btn {
            background: none; border: none; color: #94a3b8; padding: 16px 20px;
            cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab-btn.active { color: #fff; border-bottom-color: var(--accent); }
        .tab-pane { display: none; padding: 20px; }
        .tab-pane.active { display: block; }

        .comparison-grid {
            display: grid; grid-template-columns: 200px repeat(auto-fit, minmax(200px, 1fr));
            gap: 1px; background: rgba(255,255,255,0.1);
            overflow-x: auto;
        }
        .comp-header, .comp-cell {
            background: #1e293b; padding: 16px; display: flex; align-items: center;
        }
        .comp-header { font-weight: 600; color: #94a3b8; }
        
        /* Floating Toolbar */
        .batch-toolbar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #0f172a; border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px;
            border-radius: 50px; display: flex; gap: 16px; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: transform 0.3s; z-index: 900;
        }
        .batch-toolbar.visible { transform: translateX(-50%) translateY(0); }
        
        /* Models page specific header adjustments */
        .models-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 24px;
        }
        
        .models-header .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .models-header .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Top Navigation (injected via nav.js) -->
    <div id="nav-container"></div>
    <script src="/js/components/nav.js"></script>
    <script src="/js/workspace.js"></script>
    <script>injectNav('models');</script>

    <!-- Main Content -->
    <main class="container-fluid">
        <!-- Stats Row -->
        <div class="stats-row grid-4-cols">
            <div class="stat-card">
                <div class="icon-box blue"><i class="fas fa-cubes"></i></div>
                <div class="stat-info">
                    <h3>Total Models</h3>
                    <div class="number" id="statTotal">--</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon-box purple"><i class="fas fa-hdd"></i></div>
                <div class="stat-info">
                    <h3>Storage Used</h3>
                    <div class="number" id="statStorage">--</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon-box green"><i class="fas fa-microchip"></i></div>
                <div class="stat-info">
                    <h3>Active RAM</h3>
                    <div class="number" id="statRam">--</div>
                </div>
            </div>
             <div class="stat-card">
                <div class="icon-box orange"><i class="fas fa-bolt"></i></div>
                <div class="stat-info">
                    <h3>Providers</h3>
                    <div class="number">3</div>
                    <div class="sub-text">Ollama, n8n, Custom</div>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar glass-panel">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search models (e.g. 'llama3', 'coder')...">
            </div>
            <div class="filters">
                <select id="providerSelect" class="select-input">
                    <option value="all">All Providers</option>
                    <option value="ollama">Ollama</option>
                    <option value="n8n">n8n</option>
                    <option value="custom">Custom</option>
                </select>
                <select id="categorySelect" class="select-input">
                    <option value="all">All Categories</option>
                    <option value="chat">Chat / General</option>
                    <option value="code">Coding</option>
                    <option value="embedding">Embedding</option>
                </select>
                 <select id="sortSelect" class="select-input">
                    <option value="name">Name (A-Z)</option>
                    <option value="size">Size (Largest)</option>
                    <option value="newest">Newest First</option>
                </select>
            </div>
            <div class="view-toggles">
                <button id="viewToggleBtn" class="icon-btn active"><i class="fas fa-th-large"></i></button>
            </div>
        </div>

        <!-- Models Grid -->
        <div id="modelsGrid" class="models-grid">
            <!-- Rendered by JS -->
            <div class="loading-spinner">Loading models...</div>
        </div>

    </main>

    <!-- Comparison Drawer -->
    <div id="compareDrawer" class="comparison-drawer glass-panel">
        <div class="drawer-header">
            <h3>Compare Models <span class="badge" id="compareCount">0</span></h3>
            <button class="btn-text text-sm" id="clearCompare">Clear All</button>
        </div>
        <div class="drawer-body" id="compareList">
            <!-- Selected items -->
        </div>
        <div class="drawer-footer">
            <button id="compareNowBtn" class="btn-primary w-full">Compare Now <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- Batch Toolbar -->
    <div id="batchToolbar" class="batch-toolbar">
        <span class="text-white"><span id="batchCount">0</span> selected</span>
        <div class="h-separator"></div>
        <button id="batchCompareBtn" class="btn-secondary-sm"><i class="fas fa-columns"></i> Compare</button>
        <button id="batchExportBtn" class="btn-secondary-sm"><i class="fas fa-file-export"></i> Export</button>
        <button id="batchDeleteBtn" class="btn-danger-sm"><i class="fas fa-trash"></i> Delete</button>
        <button id="batchCancelBtn" class="btn-icon"><i class="fas fa-times"></i></button>
    </div>

    <!-- Modals -->

    <!-- Add Source Modal -->
    <div id="addSourceModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Model Source</h2>
                <button class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="tab-pull">Pull from Ollama</button>
                <button class="tab-btn" data-tab="tab-n8n">Connect n8n</button>
                <button class="tab-btn" data-tab="tab-custom">Custom Model</button>
            </div>
            <div class="modal-body">
                <div id="tab-pull" class="tab-pane active">
                    <div class="form-group">
                        <label>Model Name (e.g. llama3:8b)</label>
                        <div class="input-row">
                            <input type="text" id="pullModelName" class="form-input" placeholder="library/model:tag">
                            <button id="btnPull" class="btn-primary">Pull</button>
                        </div>
                        <p class="helper-text">Check <a href="https://ollama.com/library" target="_blank" class="text-accent">ollama.com/library</a> for available models.</p>
                    </div>
                    <div id="pullProgress" class="hidden">
                        <div class="progress-bar"><div class="progress-fill" style="width: 0%"></div></div>
                        <p class="status-text">Starting...</p>
                    </div>
                </div>
                <div id="tab-n8n" class="tab-pane">
                    <form id="n8nForm">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" class="form-input" required placeholder="My n8n Agent">
                        </div>
                        <div class="form-group">
                            <label>Webhook URL</label>
                            <input type="url" name="webhookUrl" class="form-input" required placeholder="https://n8n.instance/webhook/...">
                        </div>
                        <button type="submit" class="btn-primary">Connect</button>
                    </form>
                </div>
                <div id="tab-custom" class="tab-pane">
                    <p>Register a custom model definition or remote API.</p>
                    <form id="customForm">
                         <div class="form-group">
                            <label>Display Name</label>
                            <input type="text" name="displayName" class="form-input" required>
                        </div>
                         <div class="form-group">
                            <label>Base Model ID</label>
                            <input type="text" name="baseModel" class="form-input" required placeholder="gpt-4-turbo">
                        </div>
                        <button type="submit" class="btn-primary">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Comparison Modal -->
    <div id="comparisonModal" class="modal-overlay">
        <div class="modal-content full-screen-modal">
             <div class="modal-header">
                <h2>Model Comparison</h2>
                <div class="actions">
                     <button class="btn-secondary-sm"><i class="fas fa-file-pdf"></i> Export PDF</button>
                     <button class="close-modal"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="modal-body p-0">
                <div id="comparisonContainer" class="comparison-grid">
                    <!-- JS renders grid here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/models-unified.js"></script>
    <script src="js/models-management.js"></script>
    <script src="js/models-comparison.js"></script>
</body>
</html>
