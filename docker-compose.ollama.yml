name: ${AGENTX_PROJECT_NAME:-agentx}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    logging: *default-logging
    image: ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  core:
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_HOST_NAME: Docker Ollama
    depends_on:
      ollama:
        condition: service_healthy

  benchmark:
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_HOST_NAME: Docker Ollama
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
    name: ${COMPOSE_PROJECT_NAME}_canonical_ollama_data
