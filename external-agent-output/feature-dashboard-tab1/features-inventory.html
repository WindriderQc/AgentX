<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Inventory Matrix</title>
    <link rel="stylesheet" href="features-inventory.css">
    <!-- Font Awesome for icons (optional, using unicode for now to keep it dependency-free-ish, but layout prepared) -->
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1 class="dashboard-title">Feature Inventory</h1>
            <div class="dashboard-actions">
                <button id="scanBtn" class="btn btn-primary" onclick="window.inventoryApp.scanCodebase()">
                    <span>Scan Codebase</span>
                </button>
                <button id="exportBtn" class="btn" onclick="window.inventoryApp.exportReport()">
                    <span>Export CSV</span>
                </button>
                <button id="refreshBtn" class="btn" onclick="window.inventoryApp.loadInventory()">
                    <span>Refresh</span>
                </button>
            </div>
        </header>

        <div class="filters-bar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search features..." oninput="window.inventoryApp.applyFilters()">
            </div>
            
            <select id="categoryFilter" class="filter-select" onchange="window.inventoryApp.applyFilters()">
                <option value="all">All Categories</option>
                <option value="core">Core</option>
                <option value="analytics">Analytics</option>
                <option value="operations">Operations</option>
                <option value="experimental">Experimental</option>
            </select>
        </div>

        <div class="inventory-table-container">
            <table class="inventory-table" id="featuresTable">
                <thead>
                    <tr>
                        <th onclick="window.inventoryApp.sortBy('name')">Feature</th>
                        <th onclick="window.inventoryApp.sortBy('frontend')">Frontend</th>
                        <th onclick="window.inventoryApp.sortBy('backend')">Backend</th>
                        <th onclick="window.inventoryApp.sortBy('documentation')">Docs</th>
                        <th onclick="window.inventoryApp.sortBy('roadmap')">Roadmap</th>
                        <th onclick="window.inventoryApp.sortBy('status')">Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>No features found matching your criteria.</p>
                <button class="btn btn-primary" onclick="window.inventoryApp.scanCodebase()">Scan Codebase</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><strong id="statComplete">0</strong> Complete</div>
            <div class="stat-item"><strong id="statPartial">0</strong> Partial</div>
            <div class="stat-item"><strong id="statMissing">0</strong> Missing</div>
            <div class="stat-item"><strong id="statPlanned">0</strong> Planned</div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div style="text-align: center;">
            <div class="loading-spinner"></div>
            <p style="margin-top: 16px; font-weight: 500;">Scanning Codebase...</p>
        </div>
    </div>

    <script src="features-inventory.js" type="module"></script>
</body>
</html>
