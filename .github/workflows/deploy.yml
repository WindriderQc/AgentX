name: Deploy AgentX

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: self-hosted
    environment:
      name: production
      url: http://192.168.2.66:3080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Deploy Path
        id: paths
        run: |
          TARGET_DIR="${{ secrets.AGENTX_DEPLOY_PATH }}"
          TARGET_DIR="${TARGET_DIR:-/home/yb/codes/AgentX}"
          echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Backup Current State
        run: |
          cd "${{ steps.paths.outputs.target_dir }}"

          # Save current commit for rollback
          git rev-parse HEAD > .last_deploy_commit

          # Optional database backups
          ./scripts/backup-mongodb.sh 2>/dev/null || true
          ./scripts/backup-qdrant.sh 2>/dev/null || true
        continue-on-error: true

      - name: Update Code
        run: |
          cd "${{ steps.paths.outputs.target_dir }}"

          CURRENT=$(git rev-parse --short HEAD)
          echo "Current: $CURRENT"

          git fetch origin main
          git merge origin/main --ff-only || git reset --hard origin/main

          NEW=$(git rev-parse --short HEAD)
          echo "Updated: $NEW"

          npm ci --prefer-offline --no-audit

      - name: Deploy
        run: |
          cd "${{ steps.paths.outputs.target_dir }}"

          if pm2 describe agentx > /dev/null 2>&1; then
            pm2 reload agentx --update-env
          else
            pm2 start server.js --name agentx
            pm2 save
          fi

      - name: Health Check
        run: |
          sleep 10
          for i in {1..5}; do
            if curl -f http://localhost:3080/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Rollback on Failure
        if: failure()
        run: |
          cd "${{ steps.paths.outputs.target_dir }}"

          if [ -f .last_deploy_commit ]; then
            LAST=$(cat .last_deploy_commit)
            echo "Rolling back to $LAST"
            git reset --hard $LAST
            npm ci --prefer-offline --no-audit
            pm2 reload agentx --update-env
          fi
        continue-on-error: true
