name: 🔍 AgentX CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'claude/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  NODE_ENV: test

jobs:
  lint:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: ✨ Check Prettier Formatting
        run: npx prettier --check "**/*.{js,json,md}" --ignore-path .gitignore

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Unit Tests
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: 🔍 Check for Open Handles
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔗 Run Integration Tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/agentx-test
          OLLAMA_HOST: http://localhost:11434

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: integration
          fail_ci_if_error: false
        continue-on-error: true

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 npm Audit (Production)
        run: |
          echo "🔍 Running npm audit for production dependencies..."
          npm audit --production --audit-level=high || {
            echo "⚠️ Security vulnerabilities found"
            npm audit --production --json > audit-report.json
            exit 1
          }
        continue-on-error: true

      - name: 🔐 Check for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      - name: 📋 Security Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔒 Security Scan Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f audit-report.json ]; then
            echo "⚠️ npm audit found issues - review audit-report.json"
          else
            echo "✅ No critical vulnerabilities found"
          fi

  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Start Server in Background
        run: |
          export NODE_ENV=test
          export MONGODB_URI=mongodb://localhost:27017/agentx-e2e
          export AGENTX_API_KEY=test-e2e-key
          export PORT=3080
          npm start &
          echo $! > server.pid

          # Wait for server to be ready
          echo "⏳ Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:3080/health 2>/dev/null; then
              echo "✅ Server is ready!"
              break
            fi
            sleep 2
          done

      - name: 🎭 Run E2E Test Suite
        run: npm run test:e2e
        env:
          NODE_ENV: test
          E2E_CI: '1'
          SKIP_JEST: '1'
          AGENTX_API_KEY: test-e2e-key
          BASE_URL: http://localhost:3080

      - name: 🛑 Stop Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

  ci-summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, security-scan]
    if: always()
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 AgentX CI Pipeline Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Author: ${{ github.actor }}"
          echo ""
          echo "Job Results:"
          echo "  🎨 Lint & Format:      ${{ needs.lint.result }}"
          echo "  🧪 Unit Tests:         ${{ needs.unit-tests.result }}"
          echo "  🔗 Integration Tests:  ${{ needs.integration-tests.result }}"
          echo "  🔒 Security Scan:      ${{ needs.security-scan.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ✅ All Checks Passed
        if: |
          needs.lint.result == 'success' &&
          needs.unit-tests.result == 'success' &&
          needs.integration-tests.result == 'success' &&
          needs.security-scan.result == 'success'
        run: echo "🎉 All CI checks passed! Ready to merge."

      - name: ❌ Some Checks Failed
        if: |
          needs.lint.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.integration-tests.result == 'failure' ||
          needs.security-scan.result == 'failure'
        run: |
          echo "❌ Some CI checks failed. Please review and fix."
          exit 1
